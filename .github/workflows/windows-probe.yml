# TEMPORARY -- quick toolchain probes for the Windows spike
# (docs/design/windows.md §6 step 1). Runs only when this file changes.
name: Windows probe

on:
  push:
    branches: [windows-spike]
    paths: [.github/workflows/windows-probe.yml]
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v4
    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: false
        install: make perl mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-verilator

    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    # verilator.cmd candidates, exercised from native PowerShell against the
    # MSYS2 verilator package (same Perl FindBin path as our release).
    - name: Shim from PowerShell
      shell: pwsh
      run: |
        $msys = (msys2 -c 'cygpath -m /').Trim()
        $bin = "$msys\ucrt64\bin"
        Set-Content -Path "$bin\verilator.cmd" -Value "@setlocal`r`n@set `"VLT_BIN=%~dp0`"`r`n@perl `"%VLT_BIN:\=/%verilator`" %*" -NoNewline
        Get-Content "$bin\verilator.cmd"
        $env:PATH = "$bin;$msys\usr\bin;$env:PATH"
        python -c "import shutil; print('shutil.which:', shutil.which('verilator'))"
        python -c "import subprocess,shutil; r=subprocess.run([shutil.which('verilator'),'--version']); print('subprocess rc', r.returncode)"
        verilator --binary tests\smoke.sv -o simv -CFLAGS -std=gnu++17
        if ($LASTEXITCODE -ne 0) { exit 1 }
        .\obj_dir\simv.exe | Tee-Object -FilePath out.log
        if (-not (Select-String -Quiet -Path out.log -Pattern 'Hello World')) { exit 1 }
        # exit status must propagate through the shim
        verilator --no-such-option 2>$null
        "bad-option rc: $LASTEXITCODE"
        if ($LASTEXITCODE -eq 0) { exit 1 }
        exit 0

