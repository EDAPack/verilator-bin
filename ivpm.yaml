
package:
  name: verilator-bin

  dep-sets:
  - name: default-dev 
    deps: 
    - name: dv-flow-mgr
      url: https://github.com/dv-flow/dv-flow-mgr.git
    - name: dv-flow-libhdlsim
      url: https://github.com/dv-flow/dv-flow-libhdlsim.git
      # Not our default-dev: sub-deps inherit it, and libhdlsim's default-dev
      # pulls prebuilt verilator/iverilog/xezim, which have no macOS or aarch64
      # assets for every target (and would fetch our own release into our build).
      dep-set: default
    - name: edapack-common
      url: https://github.com/edapack/edapack-common.git
    - name: pytest
      src: pypi
    - name: meson
      src: pypi
#    - name: uvm
#      url: https://www.accellera.org/images/downloads/standards/uvm/Accellera-1800.2-2017-1.0.tar.gz
#    - name: verilator
#      url: https://github.com/verilator/verilator.git
