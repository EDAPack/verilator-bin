name: CI
# Thin caller of the shared edapack build pipeline. All build/release logic
# (resolve inputs -> change-gate -> build matrix -> publish, with a release
# manifest) lives in edapack-common. Input components are declared in
# build-inputs.yaml. See https://edapack.github.io (Developer Guide).
#
# NOTE: the previous bespoke workflow is archived under
# .github/workflows-legacy/ci.yml for reference/rollback. This caller uses the
# rich `targets` matrix to build x86_64 + aarch64 manylinux and native macOS
# (arm64). aarch64 uses GitHub's arm Linux runners (free on public repos).
on:
  push:
  schedule:
    - cron: "0 12 * * 0"   # Sunday 12:00 UTC — publishes only if inputs changed
  workflow_dispatch:
    inputs:
      core_ref:
        description: "Build a specific Verilator ref (tag/branch/sha), e.g. v5.038"
        type: string
      input_overrides:
        description: 'JSON map of dependency overrides, e.g. {"bitwuzla":"0.6.0"}'
        type: string
        default: "{}"
      force:
        description: "Build even if inputs are unchanged"
        type: boolean
        default: false
      prerelease:
        description: "Mark the release as prerelease"
        type: boolean
        default: true

jobs:
  build:
    uses: edapack/edapack-common/.github/workflows/build-release.yml@v1
    with:
      package: verilator-bin
      targets: |
        [
          {"name":"manylinux_2_28_x86_64","runs-on":"ubuntu-latest","kind":"docker","image":"quay.io/pypa/manylinux_2_28_x86_64"},
          {"name":"manylinux_2_34_x86_64","runs-on":"ubuntu-latest","kind":"docker","image":"quay.io/pypa/manylinux_2_34_x86_64"},
          {"name":"manylinux2014_x86_64","runs-on":"ubuntu-latest","kind":"docker","image":"quay.io/pypa/manylinux2014_x86_64"},
          {"name":"manylinux_2_28_aarch64","runs-on":"ubuntu-24.04-arm","kind":"docker","image":"quay.io/pypa/manylinux_2_28_aarch64"},
          {"name":"manylinux_2_34_aarch64","runs-on":"ubuntu-24.04-arm","kind":"docker","image":"quay.io/pypa/manylinux_2_34_aarch64"},
          {"name":"macos-arm64","runs-on":"macos-14","kind":"native"}
        ]
      core_ref: ${{ inputs.core_ref || '' }}
      input_overrides: ${{ inputs.input_overrides || '{}' }}
      # force only on an explicit dispatch; prerelease defaults true but must
      # still honor an unchecked (false) dispatch box (`false || true` == true).
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
      prerelease: ${{ github.event_name != 'workflow_dispatch' || inputs.prerelease }}
